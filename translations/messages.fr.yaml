  antistatique:
    position: 'Ingénieur Logiciel Backend'
    summary: 'De développeur junior à confirmé : la plus forte progression de ma carrière !'
    highlight_1: "Conçu et maintenu des applications d'entreprise **Symfony 6** et leurs **API REST** (**API Platform**), sous **PHP 7.4 / 8.0**, avec **Doctrine ORM**, **PostgreSQL**, du cache **Redis** et de l'indexation **Elasticsearch**."
    highlight_2: "Dirigé cinq développeurs comme Lead **PHP** sur un projet **Symfony** de 3-4 mois pour les Colis du Coeur : livraison de la v1, machines à états et workflows pour des centres de distribution bénévoles."
    highlight_3: 'Livré et maintenu six sites CMS - cinq **Drupal**, un **WordPress**.'
    highlight_4: "Réduit de **75%** le temps d'exécution des **GitHub Actions** via la mise en cache des dépendances et l'optimisation des workflows."
    highlight_5: 'Mené les revues de code et la responsabilité technique de projets de petite à moyenne envergure, dont une plateforme client sur **AWS**, en faisant respecter les standards de maintenabilité.'
    highlight_6: "Développé un petit outil interne sur un back-end **serverless Firebase** avec un front **Vue.js**."
  ilem:
    position: 'Ingénieur Logiciel Backend Junior'
    summary: 'Conseil informatique pour un client externe, Berdoz Vision & Audition.'
    highlight_1: "Sécurisé et migré vers une version **PHP** plus récente un ERP critique desservant **20 magasins**, puis participé au développement de son remplaçant sous **Laravel**."
    highlight_2: 'Configuré une flotte de **44 iPad** et mis en place des serveurs CI exécutant des suites de tests **Codeception** et **Cypress**.'
    highlight_3: 'Renforcé la sécurité et développé des composants critiques du CRM interne utilisé par ce même réseau de magasins.'
    highlight_4: "Développé l'outillage interne de tests automatisés, de monitoring et de déploiement, avec **Sentry** pour le suivi des erreurs."
  liip:
    position: 'Apprenti Développeur de Logiciels'
    highlight_1: 'Développé et enrichi des applications web internes avec **PHP** et **JavaScript**.'
    highlight_2: "Livré des fonctionnalités au sein d'une équipe **Agile**, avec **Git**, **Scrum** et des pratiques modernes de développement web."
    highlight_3: 'Développé des plugins **Moodle** sur mesure avec **PHP 5.4**.'
